! R-LAB (ISR 1941/2901) — home lab lab.local (track B, real Cisco hardware)
! Replace every <...-secret> placeholder before pasting. No real secret is stored in this repository.
!
enable
configure terminal
hostname R-LAB
no ip domain-lookup
ip domain-name lab.local
enable secret <enable-secret>
service password-encryption
username admin privilege 15 secret <admin-secret>
banner motd # Acces reserve aux administrateurs du lab #
no ip http server
no ip http secure-server
clock timezone CET 1 0
clock summer-time CEST recurring last Sun Mar 2:00 last Sun Oct 3:00
service timestamps log datetime msec localtime show-timezone
!
interface g0/0
 description TRUNK-SWITCH
 no ip address
 no shutdown
interface g0/0.10
 description VLAN10-UTILISATEURS
 encapsulation dot1Q 10
 ip address 10.2.0.1 255.255.255.192
 ip helper-address 10.2.0.70
 ip nat inside
interface g0/0.20
 description VLAN20-SERVEURS
 encapsulation dot1Q 20
 ip address 10.2.0.65 255.255.255.224
 ip nat inside
interface g0/0.30
 description VLAN30-ADMINISTRATION
 encapsulation dot1Q 30
 ip address 10.2.0.97 255.255.255.240
 ip nat inside
interface g0/0.40
 description VLAN40-DMZ
 encapsulation dot1Q 40
 ip address 10.2.0.113 255.255.255.240
 ip nat inside
interface g0/1
 description WAN-BOX
 ip address dhcp
 ip nat outside
 no shutdown
!
ip access-list standard NAT-LAB
 permit 10.2.0.0 0.0.0.255
ip nat inside source list NAT-LAB interface g0/1 overload
ip nat inside source static tcp 10.2.0.114 443 interface g0/1 443
!
ip access-list extended ACL-USERS
 permit udp any any eq bootps
 permit tcp 10.2.0.0 0.0.0.63 any established
 permit icmp 10.2.0.0 0.0.0.63 any echo-reply
 permit tcp 10.2.0.0 0.0.0.63 host 10.2.0.102 range 1514 1515
 deny   ip 10.2.0.0 0.0.0.63 10.2.0.96 0.0.0.15 log
 deny   tcp 10.2.0.0 0.0.0.63 host 10.2.0.1 eq 22 log
 permit ip 10.2.0.0 0.0.0.63 any
ip access-list extended ACL-DMZ
 permit tcp any any established
 permit udp host 10.2.0.114 host 10.2.0.70 eq domain
 permit tcp host 10.2.0.114 host 10.2.0.70 eq domain
 permit tcp host 10.2.0.114 host 10.2.0.72 eq www
 permit tcp host 10.2.0.114 host 10.2.0.102 range 1514 1515
 deny   ip any 10.2.0.0 0.0.0.255 log
 permit tcp host 10.2.0.114 any eq www
 permit tcp host 10.2.0.114 any eq 443
 permit udp host 10.2.0.114 any eq ntp
 deny   ip any any log
interface g0/0.10
 ip access-group ACL-USERS in
interface g0/0.40
 ip access-group ACL-DMZ in
!
ntp server 10.2.0.70
logging host 10.2.0.102
logging trap informational
logging source-interface g0/0.30
access-list 30 permit 10.2.0.96 0.0.0.15
line console 0
 login local
 logging synchronous
 exec-timeout 10 0
line vty 0 4
 transport input ssh
 login local
 access-class 30 in
 exec-timeout 10 0
crypto key generate rsa modulus 2048
ip ssh version 2
end
copy running-config startup-config
