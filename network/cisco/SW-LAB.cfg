! SW-LAB (Catalyst 2960) — home lab lab.local (track B, real Cisco hardware)
! Replace every <...-secret> placeholder before pasting. No real secret is stored in this repository.
!
enable
configure terminal
hostname SW-LAB
no ip domain-lookup
ip domain-name lab.local
enable secret <enable-secret>
service password-encryption
username admin privilege 15 secret <admin-secret>
banner motd # Acces reserve aux administrateurs du lab #
clock timezone CET 1 0
clock summer-time CEST recurring last Sun Mar 2:00 last Sun Oct 3:00
service timestamps log datetime msec localtime show-timezone
spanning-tree mode rapid-pvst
vlan 10
 name UTILISATEURS
vlan 20
 name SERVEURS
vlan 30
 name ADMINISTRATION
vlan 40
 name DMZ
vlan 999
 name PARKING
interface range fa0/1 - 4
 description PC-ADMIN
 switchport mode access
 switchport access vlan 30
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
interface range fa0/5 - 8
 description PC-UTILISATEUR
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
interface range fa0/9 - 24
 description NON-UTILISE
 switchport mode access
 switchport access vlan 999
 shutdown
interface range gi0/1 - 2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40
 switchport nonegotiate
interface gi0/1
 description TRUNK-ROUTEUR
interface gi0/2
 description TRUNK-PROXMOX
interface vlan 1
 shutdown
interface vlan 30
 description MANAGEMENT
 ip address 10.2.0.98 255.255.255.240
 no shutdown
ip default-gateway 10.2.0.97
ntp server 10.2.0.70
logging host 10.2.0.102
logging trap informational
logging source-interface vlan 30
access-list 30 permit 10.2.0.96 0.0.0.15
line console 0
 login local
 logging synchronous
 exec-timeout 10 0
line vty 0 15
 transport input ssh
 login local
 access-class 30 in
 exec-timeout 10 0
crypto key generate rsa modulus 2048
ip ssh version 2
end
copy running-config startup-config
