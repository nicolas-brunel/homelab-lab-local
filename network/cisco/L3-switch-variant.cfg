! Variant: inter-VLAN routing on a Catalyst 3560/3650 (SVIs); router keeps NAT + WAN
! ---- L3 switch
ip routing
interface vlan 10
 ip address 10.2.0.1 255.255.255.192
 ip helper-address 10.2.0.70
 ip access-group ACL-USERS in
interface vlan 20
 ip address 10.2.0.65 255.255.255.224
interface vlan 30
 ip address 10.2.0.97 255.255.255.240
interface vlan 40
 ip address 10.2.0.113 255.255.255.240
 ip access-group ACL-DMZ in
interface gi0/1
 description LIEN-ROUTEUR
 no switchport
 ip address 10.255.255.2 255.255.255.252
ip route 0.0.0.0 0.0.0.0 10.255.255.1

! ---- router
interface g0/0
 ip address 10.255.255.1 255.255.255.252
 ip nat inside
ip route 10.2.0.0 255.255.255.0 10.255.255.2
